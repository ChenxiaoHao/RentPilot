        }
      }

<p class="text-[14px] text-muted tracking-normal font-normal">

</div>

<svg class="w-full text-black h-auto object-bottom" fill="currentColor" viewBox="0 0 400 240">
<!-- 东方明珠塔及陆家嘴建筑群矢量轮廓 -->

<rect height="70" width="1.5" x="94.5" y="10"></rect>
<circle cx="95.2" cy="78" r="7.5"></circle>
<rect height="24" width="2.8" x="93.8" y="85"></rect>
<circle cx="95.2" cy="115" r="13"></circle>
<path d="M85 180 L92 128 L98 128 L105 180 Z"></path>

<path d="M78 240 L88 195 L102 195 L112 240 Z"></path>

<rect height="50" width="35" x="352" y="190"></rect>

</svg>
</div>
<!-- 底部悬浮 AI 提问卡片 -->
<div class="relative z-10 mt-auto mb-2 bg-white rounded-[24px] border border-subtle shadow-card-float p-4 flex flex-col justify-between min-h-[128px]" data-purpose="chat-input-box">
<p class="text-[13.5px] text-muted leading-relaxed select-text font-normal">
          例如：我在张江上班，预算 5000 元，想找整租一居室，通勤 30 分钟以内…
        </p>
<div class="flex items-center justify-between pt-2">
<!-- 图片上传按钮 -->
